<div class="wrap fwrap">
  <header class="top">
    <div class="eyebrow">Español 30-3Y · Juego 3 · Prototipo de «La semana»</div>
    <h1>¡Fallas!</h1>
    <p class="lede">Valencia, March. Drag to look around, scroll to zoom, and click the sparkles to find the six <i>Datos de Valencia</i>.</p>
  </header>
  <nav id="tabs" class="tabs">
    <button data-k="plaza">La mascletà</button>
    <button data-k="calle">La falla del barrio</button>
    <button data-k="ofrenda">La ofrenda</button>
    <button data-k="bunyols">Los buñuelos</button>
    <button data-k="crema">La cremà</button>
    <span class="sp"></span>
    <button id="reroll" class="ghostbtn">🎲 Otras fallas</button>
  </nav>
  <div id="themeName" class="themename"></div>
  <section class="stage3d">
    <div class="stagehead">
      <div class="place" id="place"></div>
      <div class="gemtally">✦ Datos de Valencia <b id="gemCount">0/6</b></div>
    </div>
    <div id="view3d"></div>
    <div class="linebar">
      <div class="who" id="who">Nerea</div>
      <div class="line"><div id="lineEs" class="es"></div><div id="lineEn" class="en"></div></div>
      <div class="audio">
        <button class="btn small ghost" id="replay">▶ Otra vez</button>
        <button class="btn small ghost" id="slow">🐢 Lento</button>
        <label class="mini"><input type="checkbox" id="showText"> Mostrar texto</label>
      </div>
      <button class="btn primary" id="goBtn"></button>
    </div>
    <div id="gemCard" class="gemcard" hidden>
      <div class="gh">✦ Dato de Valencia</div>
      <p id="gemEs" class="es"></p>
      <p id="gemEn" class="en2"></p>
      <button class="btn small" id="gemClose">Cerrar</button>
    </div>
  </section>
</div>
