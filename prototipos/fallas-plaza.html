<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Fallas! · Valencia (prototipo de La semana)</title>
<meta name="sg-game" content="33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
<style>
/* Atardecer: one deliberate dusk look (dark-first, single theme). Layout comment: skyline band on top, glass cards on a night ground. */
:root {
  color-scheme: dark;
  --bg: #17122E; --bg-top: #2A2152;
  --surface: #221B44; --surface-2: #2C2454; --ink: #F5F1FF; --muted: #BDB4DD; --line: #3E3570;
  --accent: #5FE0C8; --accent-ink: #14102A; --accent-soft: rgba(95, 224, 200, .14);
  --sun: #FFC27A; --sun-soft: rgba(255, 194, 122, .14);
  --ok: #6FE8C9; --ok-soft: rgba(95, 224, 200, .13);
  --warn: #FFD27A; --warn-soft: rgba(255, 210, 122, .12);
  --err: #FF9AA5; --err-soft: rgba(255, 120, 135, .14);
  --tile-bg: #2A2152; --tile-a: #FFC27A; --tile-b: #5FE0C8;
  --ground: #1E1840; --street: #3A3168; --street-ink: #CFC6EC; --block: #2E2659; --block-line: #4B4185; --park: #22503F;
  --grass: #22503F; --path: #6B5A45; --stone: #8A8295; --water: #4FA3C9; --led-bg: #0E0B1E; --led: #FFC27A;
  --wall: #3A3068; --wall-2: #332A5E; --floor: #5E4A3A; --roof: #B85C38; --sky: #2A2152; --wood: #7A5236;
  --font-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Manrope", "Segoe UI", system-ui, sans-serif;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.tiles {
  height: 28px; background-color: var(--tile-bg);
  background-image:
    radial-gradient(circle, var(--tile-a) 0 3.5px, transparent 4px),
    radial-gradient(circle at 0 0, var(--tile-b) 0 8px, transparent 8.5px),
    radial-gradient(circle at 100% 0, var(--tile-b) 0 8px, transparent 8.5px),
    radial-gradient(circle at 0 100%, var(--tile-b) 0 8px, transparent 8.5px),
    radial-gradient(circle at 100% 100%, var(--tile-b) 0 8px, transparent 8.5px);
  background-size: 28px 28px;
}
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
  display: flex; flex-direction: column; gap: 22px;
}
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 5vw, 48px); line-height: 1; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.lede { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 14px; user-select: none; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.card h3, h3.lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 500; }
.game { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .game { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stage { overflow: hidden; }
.stagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.stagehead .place { font-family: var(--font-mono); letter-spacing: .04em; text-transform: uppercase; font-size: 12px; color: var(--ink); }
.viewport { position: relative; }
.viewport > svg { display: block; width: 100%; height: auto; }
svg .ico { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
svg .roomlbl { font-family: var(--font-mono); font-size: 12px; fill: var(--ink); opacity: .75; letter-spacing: .04em; }
.nolabels .roomlbl, .nolabels .itemlbl { display: none; }

.intro { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 80%, transparent); }
.intro .box { max-width: 470px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 40px rgba(10, 20, 50, .18); }
.intro h2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.05; margin: 0; }
.intro p { margin: 0; color: var(--muted); }
.intro ul { margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 560px) { .intro { position: static; } .intro .box { box-shadow: none; } }

.btn { border: 0; border-radius: 12px; padding: 0 16px; min-height: 44px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--sun); }
.btn.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 16px; }
.choice:hover { border-color: var(--accent); }
.choice:disabled { opacity: .5; cursor: default; }

.panel { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.panelhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.task { margin: 0; font-size: 15px; }

.fbs { display: flex; flex-direction: column; gap: 6px; }
.chip { display: flex; flex-direction: column; gap: 2px; font-size: 14px; padding: 8px 12px; border-radius: 10px; }
.chip b { font-weight: 700; }
.chip .en { font-size: 13px; opacity: .85; color: var(--ink); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.err { background: var(--err-soft); color: var(--err); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip .fix s { opacity: .75; }
.appear { animation: appear .25s ease-out both; }
@keyframes appear { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .appear { animation: none; } }

/* message feed */
.feedcard { display: flex; flex-direction: column; }
.feedhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.mini-switch { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.mini-switch input { accent-color: var(--accent); margin: 0; }
.feed { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; max-height: 360px; min-height: 120px; overflow-y: auto; }
.feed .empty { margin: 0; color: var(--muted); font-size: 14px; }
.msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.msg .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 12px; color: #15203b; background: var(--sun); }
.mhead { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.mhead .time { color: var(--muted); font-size: 12px; font-family: var(--font-mono); }
.mtext { margin: 2px 0 6px; font-size: 16px; overflow-wrap: anywhere; }
.mtext.masked { color: var(--muted); font-style: italic; }
.mctl { display: flex; gap: 6px; flex-wrap: wrap; }
.mctl button { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.mctl button:hover { border-color: var(--accent); }
.mctl .play { color: var(--accent); font-weight: 700; }
.msg.me { grid-template-columns: minmax(0, 1fr); justify-items: end; }
.msg.me .bubble { background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 14px 14px 4px 14px; max-width: 90%; overflow-wrap: anywhere; }
.msg.me .fbrow { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-top: 6px; max-width: 95%; }
.typing { color: var(--muted); font-size: 13px; font-style: italic; margin: 0; }
.no-tts .play, .no-tts .slow, .no-tts .tts-only { display: none !important; }

/* typing input with accent bar */
.composer { display: flex; flex-direction: column; gap: 8px; }
.accentbar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.accentbar button { min-width: 34px; height: 34px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); border-bottom-width: 3px; background: var(--surface-2); font-size: 17px; cursor: pointer; transition: background .2s, border-color .2s; }
.accentbar button:hover { border-color: var(--accent); }
.accentbar button.flash { background: var(--sun); border-color: var(--sun); color: #15203b; }
.accentbar .caps { font-size: 12px; color: var(--muted); margin-left: 4px; }
.inputrow { display: flex; gap: 8px; }
.inputrow input, .inputrow textarea { flex: 1; min-width: 0; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); resize: vertical; }
.inputrow input:focus, .inputrow textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
@media (max-width: 480px) { .inputrow { flex-wrap: wrap; } .inputrow input, .inputrow textarea { flex-basis: 100%; } .inputrow .btn { flex: 1; } }
.keyhelp { margin: 0; font-size: 12px; color: var(--muted); }
kbd { font-family: var(--font-mono); font-size: 12px; padding: 0 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface-2); color: var(--ink); }

/* mission list */
.missions { padding: 14px 16px; }
.missions ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }
.missions li { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; color: var(--muted); font-size: 14px; min-width: 0; }
.missions li .n { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; border: 1.5px solid var(--line); }
.missions li .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.missions li .stars { margin-left: auto; color: var(--sun); font-size: 13px; flex: none; }
.missions li.current { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.missions li.current .n { border-color: var(--accent); color: var(--accent); }
.missions li.done { color: var(--ink); }
.missions li.done .n { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* summary */
.summary { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.summary h2 { font-family: var(--font-display); font-weight: 800; font-size: 30px; margin: 0; }
.summary h3 { margin-bottom: 8px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.stat .v { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 13px; color: var(--muted); margin-top: 4px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--sun-soft); color: var(--warn); border: 1px solid var(--sun); }
.badge.off { background: transparent; color: var(--muted); border: 1px dashed var(--line); font-weight: 400; }
.mrows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .mrows { grid-template-columns: 1fr; } }
.mrow { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.mrow .stars { color: var(--sun); }
.transcript { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; max-width: 80ch; }
.transcript b { font-weight: 700; }
.outcomes { font-size: 14px; color: var(--muted); margin: 0; }
details.teacher { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
details.teacher summary { cursor: pointer; font-weight: 700; }
details.teacher ul { margin: 12px 0 4px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 80ch; }

/* ---- Atardecer theme layer ---- */
body { background: linear-gradient(180deg, var(--bg-top) 0, var(--bg) 560px) no-repeat, var(--bg); color: var(--ink); font-family: var(--font-body); }
.tiles { display: none; }
.dusk-band { position: relative; height: 112px; overflow: hidden; }
.dusk-band svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
h1 { font-family: var(--font-display); font-weight: 700; letter-spacing: -.01em; }
.eyebrow { font-family: var(--font-body); font-weight: 800; letter-spacing: .16em; color: var(--accent); }
.lede { color: var(--muted); }
.card { background: rgba(34, 27, 68, .84); border: 1px solid rgba(255, 255, 255, .1); border-radius: 22px; box-shadow: 0 14px 40px rgba(6, 4, 18, .35); }
.card h3, h3.lbl, .missions h3, .help h3 { font-family: var(--font-body); font-weight: 800; letter-spacing: .14em; color: var(--muted); }
.switch { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .16); color: var(--ink); }
.switch:hover { border-color: rgba(255, 255, 255, .34); }
.btn { border-radius: 999px; font-family: var(--font-body); font-weight: 800; }
.btn.primary { background: var(--sun); color: #17122E; box-shadow: 0 0 22px rgba(255, 194, 122, .35); }
.btn.primary:hover { box-shadow: 0 0 32px rgba(255, 194, 122, .6); }
.btn.ghost { border: 1px solid rgba(255, 255, 255, .24); color: var(--ink); }
.choice { background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .16); border-radius: 16px; color: var(--ink); transition: border-color .15s, background .15s, transform .1s; }
.choice:hover { border-color: var(--accent); background: rgba(95, 224, 200, .08); }
.choice:active { transform: scale(.99); }
input[type="text"] { background: rgba(255, 255, 255, .07) !important; border: 1px solid rgba(255, 255, 255, .24) !important; color: var(--ink); border-radius: 999px !important; padding-inline: 20px !important; }
input[type="text"]:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft) !important; outline: none; }
input[type="text"]::placeholder { color: #8F86B5; }
.accentbar button { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .2); border-radius: 10px; color: var(--ink); }
.accentbar button.flash { background: var(--sun); border-color: var(--sun); color: #17122E; }
.chip { border-radius: 14px; }
.stat { background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); border-radius: 16px; }
.stat .v, .summary h2, .intro h2, .lucia h2 { font-family: var(--font-display); font-weight: 700; }
.badge { background: var(--sun-soft); color: var(--sun); border-color: rgba(255, 194, 122, .6); }
.badge.off { color: var(--muted); border-color: rgba(255, 255, 255, .18); }
.intro { background: rgba(23, 18, 46, .6); backdrop-filter: blur(4px); display: flex; overflow-y: auto; }
.intro { z-index: 6; }
.intro .box { margin: auto; }
.intro .box { background: rgba(34, 27, 68, .94); border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 20px 60px rgba(6, 4, 18, .5); }
details.teacher { background: rgba(34, 27, 68, .6); border: 1px solid rgba(255, 255, 255, .1); }
kbd { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .2); color: var(--ink); }
.av.portrait, .mini, .lucia svg { background: radial-gradient(circle at 50% 38%, #7B4A80, #2A2152); overflow: hidden; }
.av.portrait { padding: 0; }
.av.portrait svg { width: 100%; height: 100%; display: block; }
.lucia svg { border-radius: 50%; box-shadow: 0 0 0 3px rgba(255, 194, 122, .35); }
.missions li.done .n { color: #14102A; }
.sfx-switch svg { width: 16px; height: 16px; }
@keyframes pop { 0% { transform: scale(.7); opacity: 0 } 60% { transform: scale(1.06); opacity: 1 } 100% { transform: scale(1) } }
.chip.ok { animation: pop .35s cubic-bezier(.2, .9, .3, 1.3) both; }
.badge:not(.off) { animation: pop .45s cubic-bezier(.2, .9, .3, 1.3) both; }
.badge:not(.off):nth-child(2) { animation-delay: .1s } .badge:not(.off):nth-child(3) { animation-delay: .2s }
.badge:not(.off):nth-child(4) { animation-delay: .3s } .badge:not(.off):nth-child(5) { animation-delay: .4s } .badge:not(.off):nth-child(6) { animation-delay: .5s }
@media (prefers-reduced-motion: reduce) { .chip.ok, .badge:not(.off) { animation: none; } }

.fwrap { max-width: 1280px; }
.stage3d { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); background: #221B44; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.stage3d .stagehead { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; font-size: 14px; color: #E9E4FF; }
.gemtally { color: #FFC27A; } .gemtally b { color: #FFE7A8; }
#view3d { height: min(64vh, 620px); position: relative; }
#view3d canvas { width: 100% !important; height: 100% !important; display: block; cursor: grab; }
.linebar { display: grid; grid-template-columns: auto 1fr auto auto; gap: 16px; align-items: center; padding: 14px 18px; background: rgba(23,18,46,.92); border-top: 1px solid rgba(255,255,255,.08); }
.linebar .who { font: 700 13px/1 'Unbounded', sans-serif; color: #5FE0C8; padding: 8px 12px; border-radius: 999px; background: rgba(95,224,200,.12); }
.linebar .line { min-height: 40px; }
.linebar .es, .linebar .en { display: none; }
body.show-text .linebar .es { display: block; font-weight: 600; }
body.show-text .linebar .en { display: block; color: #B9B2D6; font-size: 13px; }
.linebar .line::before { content: '🔊 Escucha… (el texto está oculto)'; color: #B9B2D6; font-size: 14px; }
body.show-text .linebar .line::before { content: none; }
.linebar .audio { display: flex; gap: 8px; align-items: center; }
.linebar .mini { font-size: 12px; color: #B9B2D6; display: flex; gap: 6px; align-items: center; }
body.no-tts .linebar .audio button { display: none; }
.gemcard { position: absolute; right: 18px; top: 58px; width: min(380px, 80%); padding: 18px 20px; border-radius: 22px; background: rgba(34,27,68,.94); border: 1px solid rgba(255,231,168,.45); backdrop-filter: blur(8px); color: #F4F0FF; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
.gemcard .gh { font: 700 12px/1 'Manrope', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #FFC27A; margin-bottom: 8px; }
.gemcard .es { font-weight: 600; margin: 0 0 8px; } .gemcard .en2 { color: #B9B2D6; font-size: 14px; margin: 0 0 12px; }
@media (max-width: 800px) { .linebar { grid-template-columns: 1fr; } }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
.tabs button { font: 600 14px/1 'Manrope', sans-serif; color: #E9E4FF; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 10px 16px; cursor: pointer; }
.tabs button.on { background: #5FE0C8; color: #17122E; border-color: #5FE0C8; }
.tabs .sp { flex: 1; }
.tabs .ghostbtn { color: #FFC27A; border-color: rgba(255,194,122,.4); }
.themename { color: #B9B2D6; font-size: 13px; margin: 0 0 12px; }

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* ===================== WORLD: renderer, looks, camera, gems, particles, scene switching ===================== */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const host = $('#view3d');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
host.appendChild(renderer.domElement);
window.__renderer = renderer;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xE9D3C0, 70, 170);
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 500);
const hemi = new THREE.HemisphereLight(0xCFE3FF, 0xB98A62, .75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xFFE2B8, 1.35); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 10, far: 200 }); sun.shadow.bias = -.0006;
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0xC9DAFF, .45); rim.position.set(40, 30, -40); scene.add(rim);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}
const M = (color, o = {}) => { const m = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .78, metalness: 0 }, o)); m.color.convertSRGBToLinear(); return m; };
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}

/* ---------- lighting looks ---------- */
const SKIES = {
  day: [['#5B8FD6', 0], ['#A9C9EE', .55], ['#F4D7B5', .85], ['#F6C89A', 1]],
  golden: [['#4E6FB8', 0], ['#C9A6C8', .5], ['#F7B98A', .8], ['#FFD08A', 1]],
  dusk: [['#1E1846', 0], ['#4A2F6E', .45], ['#B5577A', .78], ['#F29A6A', 1]],
  night: [['#05040F', 0], ['#0E0B2A', .6], ['#2A1B45', .9], ['#4A2A3A', 1]],
};
const _sky = {};
function skyTex(k) {
  if (_sky[k]) return _sky[k];
  return (_sky[k] = canvasTex(512, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); SKIES[k].forEach(([c, s]) => gr.addColorStop(s, c)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    if (k === 'night' || k === 'dusk') for (let i = 0; i < (k === 'night' ? 220 : 60); i++) { g.fillStyle = `rgba(255,255,255,${rnd(.3, .9)})`; g.fillRect(rnd(0, w), rnd(0, h * .6), rnd(1, 2.2), rnd(1, 2.2)); }
  }));
}
const LOOKS = {
  day: { sky: 'day', fog: 0xE9D3C0, near: 80, far: 190, hemi: [0xCFE3FF, 0xB98A62, .75], sun: [0xFFE2B8, 1.35, [-40, 60, 25]], rim: .45 },
  golden: { sky: 'golden', fog: 0xEFC4A0, near: 70, far: 180, hemi: [0xFFE0C0, 0x8A5A42, .62], sun: [0xFFC08A, 1.25, [-70, 35, 35]], rim: .35 },
  dusk: { sky: 'dusk', fog: 0x3A2852, near: 50, far: 160, hemi: [0x8A7AC8, 0x3A2440, .6], sun: [0xFF9F7A, .5, [-70, 22, 10]], rim: .5 },
  night: { sky: 'night', fog: 0x0E0B22, near: 50, far: 170, hemi: [0x4A4F8A, 0x140C18, .42], sun: [0x9FB4FF, .22, [30, 60, -20]], rim: .2 },
};
function setLook(k) {
  const L = LOOKS[k]; scene.background = skyTex(L.sky);
  scene.fog.color.set(L.fog).convertSRGBToLinear(); scene.fog.near = L.near; scene.fog.far = L.far;
  hemi.color.set(L.hemi[0]); hemi.groundColor.set(L.hemi[1]); hemi.intensity = L.hemi[2];
  sun.color.set(L.sun[0]); sun.intensity = L.sun[1]; sun.position.set(...L.sun[2]); rim.intensity = L.rim;
}

/* ---------- particle sprites (smoke, flashes, fire, sparks) ---------- */
const TEX = {
  smoke: canvasTex(128, 128, g => { const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62); gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(.5, 'rgba(235,235,235,.55)'); gr.addColorStop(1, 'rgba(230,230,230,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }),
  fire: canvasTex(128, 128, g => { const gr = g.createRadialGradient(64, 70, 2, 64, 64, 62); gr.addColorStop(0, 'rgba(255,250,210,1)'); gr.addColorStop(.25, 'rgba(255,200,90,.95)'); gr.addColorStop(.6, 'rgba(255,90,30,.55)'); gr.addColorStop(1, 'rgba(180,30,10,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }),
  spark: canvasTex(64, 64, g => { const gr = g.createRadialGradient(32, 32, 1, 32, 32, 30); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }),
  gem: canvasTex(128, 128, g => { const gr = g.createRadialGradient(64, 64, 2, 64, 64, 60); gr.addColorStop(0, 'rgba(255,248,220,1)'); gr.addColorStop(.25, 'rgba(255,231,168,.9)'); gr.addColorStop(1, 'rgba(255,194,122,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 4; g.beginPath(); g.moveTo(64, 8); g.lineTo(64, 120); g.moveTo(8, 64); g.lineTo(120, 64); g.stroke(); }),
};
let PARTS = [];
function sprite(parent, tex, color, x, y, z, size, additive, opacity = 1) {
  const m = new THREE.SpriteMaterial({ map: tex, color, transparent: true, depthWrite: false, opacity, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, fog: !additive });
  const s = new THREE.Sprite(m); s.position.set(x, y, z); s.scale.set(size, size, 1); parent.add(s); return s;
}
function addPart(obj, max, upd) { PARTS.push({ obj, life: 0, max, upd }); }
function stepParts(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const p = PARTS[i]; p.life += dt; p.upd(p, dt, p.life / p.max);
    if (p.life > p.max) { p.obj.parent && p.obj.parent.remove(p.obj); p.obj.material && p.obj.material.dispose(); PARTS.splice(i, 1); }
  }
}
function clearParts() { PARTS.forEach(p => { p.obj.parent && p.obj.parent.remove(p.obj); p.obj.material && p.obj.material.dispose(); }); PARTS = []; }
function puff(parent, x, y, z, big = 1, color = 0xEDE7E0, vy = 1) {
  const s = sprite(parent, TEX.smoke, color, x, y, z, rnd(2, 3.5) * big, false, .9);
  const up = rnd(.6, 1.6) * vy, grow = rnd(1.4, 2.4) * big;
  addPart(s, rnd(6, 10), (p, dt, f) => { s.position.y += up * dt; s.position.x += dt * .8; const k = s.scale.x + grow * dt; s.scale.set(k, k, 1); s.material.opacity = .9 * (1 - f); });
}
function flash(parent, x, y, z, color) {
  const s = sprite(parent, TEX.spark, color || pick([0xFFF3C4, 0xFFC27A, 0xFFFFFF]), x, y, z, 1.4, true);
  addPart(s, .18, (p, dt, f) => { const k = 1.4 + f * 6; s.scale.set(k, k, 1); s.material.opacity = 1 - f; });
}
function flame(parent, x, y, z, size = 3, rise = 3) {
  const s = sprite(parent, TEX.fire, pick([0xFFFFFF, 0xFFE0A0, 0xFFC080]), x, y, z, size, true, .95);
  const vx = rnd(-.5, .5), vz = rnd(-.5, .5);
  addPart(s, rnd(.6, 1.2), (p, dt, f) => { s.position.y += rise * dt * (1 + f); s.position.x += vx * dt; s.position.z += vz * dt; const k = size * (1 - f * .7); s.scale.set(k, k * 1.25, 1); s.material.opacity = .95 * (1 - f); });
}
function ember(parent, x, y, z, v, color = 0xFFB050, life = 1.6, grav = 6, size = .5) {
  const s = sprite(parent, TEX.spark, color, x, y, z, size, true); const vel = v.clone();
  addPart(s, life * rnd(.7, 1.2), (p, dt, f) => { vel.y -= grav * dt; s.position.addScaledVector(vel, dt); s.material.opacity = 1 - f; });
}

/* ---------- audio: synthesized bangs, crackle and whoosh (Web Audio, no files) ---------- */
let AC = null;
function noiseHit({ gain = .5, freq = 2000, decay = 5, len = .35, type = 'lowpass', sweep = 0 } = {}) {
  if (window.__mute || !SFXON) return;
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  const n = Math.floor(AC.sampleRate * len), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(60, freq * sweep), AC.currentTime + len);
  const g = AC.createGain(); g.gain.value = gain; src.connect(f).connect(g).connect(AC.destination); src.start();
}
let SFXON = true;
const bang = (gain = .5, low = false) => noiseHit({ gain, freq: low ? 380 : rnd(1400, 3200), decay: low ? 2 : 5 });
const crackle = () => noiseHit({ gain: .12, freq: rnd(2500, 5000), decay: 9, len: .08, type: 'highpass' });
const whoosh = () => noiseHit({ gain: .18, freq: 600, decay: .6, len: 1.1, type: 'bandpass', sweep: 5 });

/* ---------- speech: one Spanish voice; hide audio if none ---------- */
let VOZ = null;
function rankVoice(v) {
  const n = (v.name + ' ' + v.lang).toLowerCase(); if (!/^es/.test(v.lang.toLowerCase())) return -1; let s = 0;
  if (/natural|online/.test(n)) s += 50; if (/google/.test(n)) s += 30;
  return s + (({ 'es-es': 9, 'es-mx': 8, 'es-us': 6, 'es-419': 4 })[v.lang.toLowerCase()] || 1);
}
function pickVoice() { const vs = speechSynthesis.getVoices().filter(v => rankVoice(v) >= 0).sort((a, b) => rankVoice(b) - rankVoice(a)); VOZ = vs[0] || null; document.body.classList.toggle('no-tts', !VOZ); }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } else document.body.classList.add('no-tts');
function speak(t, slow) {
  if (!VOZ || window.__mute) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.replace(/[«»]/g, '')); u.voice = VOZ; u.lang = VOZ.lang; u.rate = slow ? .7 : .95; speechSynthesis.speak(u);
}
let lastLine = '';
function say(es, en, who = 'Nerea') { lastLine = es; $('#who').textContent = who; $('#lineEs').textContent = es; $('#lineEn').textContent = en; speak(es); }
$('#replay').onclick = () => speak(lastLine);
$('#slow').onclick = () => speak(lastLine, true);
$('#showText').onchange = e => document.body.classList.toggle('show-text', e.target.checked);

/* ---------- gems: six "Datos de Valencia" spread across the week ---------- */
const found = new Set();
function addGem(group, gem) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.gem, transparent: true, depthWrite: false, depthTest: false, opacity: found.has(gem.id) ? .35 : 1 }));
  s.position.copy(gem.pos); s.scale.set(2.6, 2.6, 1); s.renderOrder = 10; s.userData.gem = gem; group.add(s); gem.sprite = s; return s;
}
function openGem(gem) {
  found.add(gem.id); gem.sprite.material.opacity = .35;
  $('#gemEs').textContent = gem.es; $('#gemEn').textContent = gem.en; $('#gemCount').textContent = `${found.size}/6`; $('#gemCard').hidden = false;
  speak(gem.es);
}
$('#gemClose').onclick = () => $('#gemCard').hidden = true;

/* ---------- camera: drag to orbit, wheel to zoom, idle drift ---------- */
const orbit = { th: .35, ph: 1.12, r: 92, tTh: .35, tPh: 1.12, tR: 92, target: new THREE.Vector3(0, 17, -2), minR: 30, maxR: 125, minPh: .55, maxPh: 1.5, drift: .02 };
let drag = null, moved = 0, shake = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; moved = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy); orbit.tTh -= dx * .005; orbit.tPh = Math.min(orbit.maxPh, Math.max(orbit.minPh, orbit.tPh - dy * .004)); drag = { x: e.clientX, y: e.clientY }; }
  else cv.style.cursor = hitGem(e) ? 'pointer' : 'grab';
});
cv.addEventListener('pointerup', e => { if (moved < 6) { const g = hitGem(e); if (g) openGem(g); } drag = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); orbit.tR = Math.min(orbit.maxR, Math.max(orbit.minR, orbit.tR + e.deltaY * .05)); }, { passive: false });
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function hitGem(e) {
  if (!CUR) return null;
  const r = cv.getBoundingClientRect(); mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera); const h = ray.intersectObjects(CUR.gems.map(g => g.sprite)); return h[0] && h[0].object.userData.gem;
}

/* ---------- scenes ---------- */
const DEFS = {}, BUILT = {};
let CUR = null, CURKEY = null;
function defineScene(key, def) { DEFS[key] = def; }
function disposeGroup(g) { g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); g.parent && g.parent.remove(g); }
function enterScene(key) {
  if (CUR && CUR.onExit) CUR.onExit();
  clearParts(); $('#gemCard').hidden = true;
  const def = DEFS[key];
  if (!BUILT[key]) { const g = new THREE.Group(); scene.add(g); const r = def.build(g) || {}; BUILT[key] = Object.assign({ group: g, anims: [], gems: [] }, r); (def.gems || []).forEach(gm => BUILT[key].gems.push(gm)); BUILT[key].gems.forEach(gm => addGem(g, gm)); }
  for (const k in BUILT) BUILT[k].group.visible = k === key;
  CUR = BUILT[key]; CURKEY = key;
  setLook(def.look);
  const c = def.cam; Object.assign(orbit, { tTh: c.th, th: c.th, tPh: c.ph, ph: c.ph, tR: c.r, r: c.r, minR: c.minR || 30, maxR: c.maxR || 125, minPh: c.minPh || .55, maxPh: c.maxPh || 1.5, drift: c.drift ?? .02 });
  orbit.target.set(...c.target);
  $('#place').innerHTML = def.place;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === key));
  const btn = $('#goBtn');
  if (CUR.action) { btn.hidden = false; btn.disabled = false; btn.textContent = CUR.action.label; btn.onclick = () => CUR.action.fn(btn); } else btn.hidden = true;
  if (CUR.onEnter) CUR.onEnter();
  say(...def.line);
}
function rebuild(keys) { keys.forEach(k => { if (BUILT[k]) { disposeGroup(BUILT[k].group); delete BUILT[k]; } }); }

/* ---------- loop ---------- */
function resize() { const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
const clockT = new THREE.Clock();
function frame() {
  const dt = Math.min(clockT.getDelta(), .05) * (window.__timeScale || 1), t = clockT.elapsedTime;
  if (!drag) orbit.tTh += dt * orbit.drift;
  orbit.th += (orbit.tTh - orbit.th) * .08; orbit.ph += (orbit.tPh - orbit.ph) * .08; orbit.r += (orbit.tR - orbit.r) * .08;
  camera.position.set(orbit.target.x + orbit.r * Math.sin(orbit.ph) * Math.sin(orbit.th), orbit.target.y + orbit.r * Math.cos(orbit.ph), orbit.target.z + orbit.r * Math.sin(orbit.ph) * Math.cos(orbit.th));
  if (shake > 0) { camera.position.x += rnd(-1, 1) * shake; camera.position.y += rnd(-1, 1) * shake; shake *= .9; if (shake < .01) shake = 0; }
  camera.lookAt(orbit.target);
  if (CUR) { CUR.anims.forEach(f => f(t, dt)); CUR.gems.forEach((g, i) => { const k = 2.3 + Math.sin(t * 3 + i) * .35; g.sprite.scale.set(k, k, 1); }); }
  stepParts(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- merge a figure's static pieces into one mesh per material (far fewer draw calls) ---------- */

    const k = o.material.uuid; if (!buckets.has(k)) buckets.set(k, { mat: o.material, geos: [], cast: o.castShadow }); buckets.get(k).geos.push(g); victims.push(o);

    const floating = [0, 1, 2, 3].map(i => { const b = bun(0xC98A3A); b.position.set(Math.cos(i * 1.6) * .4, .6, Math.sin(i * 1.6) * .4); return b; });

    for (let i = 0; i < 9; i++) { const b = mesh(new THREE.TorusGeometry(.13, .06, 8, 14), M(0xB8762E), -.35 + (i % 3) * .35, .07 + Math.floor(i / 3) * .05, -.2 + Math.floor(i / 3) * .2, tray); b.rotation.x = Math.PI / 2; }
    const cups = [];
    for (let i = 0; i < 3; i++) { const c = new THREE.Group(); c.position.set(.7 + i * .45, 1.2, 1.7); S.add(c); mesh(new THREE.CylinderGeometry(.14, .11, .26, 14), M(0xFFFFFF), 0, .13, 0, c); mesh(new THREE.CylinderGeometry(.12, .12, .02, 14), M(0x4A2414, { roughness: .3 }), 0, .25, 0, c); cups.push(c); }
    for (let i = 0; i < 2; i++) { const c = new THREE.Group(); c.position.set(2.3 + i * .45, 1.2, 1.55); S.add(c); mesh(new THREE.CylinderGeometry(.13, .1, .5, 14), M(0xF6EEDD, { transparent: true, opacity: .95 }), 0, .25, 0, c); const fa = mesh(new THREE.CylinderGeometry(.07, .07, .62, 8), M(0xE8C08A), .25, .07, 0, c); fa.rotation.z = Math.PI / 2; }
    // vendors and queue
    const v1 = person({ skirt: false, topC: 0xffffff, apron: 0x8A2E2A, hat: 'cap', hatC: 0x8A2E2A, pose: 'hold' }, .2); v1.position.set(-1.6, 0, -.2); S.add(v1);
    const v2 = person({ skirt: true, topC: 0xffffff, apron: 0x8A2E2A, pose: 'offer', propR: 'tray' }, .2); v2.position.set(1.2, 0, -.2); S.add(v2);

    return { anims: [anim], action: { label: 'Pedir buñuelos', fn() {

      say('Seis buñuelos, ¿verdad? Son tres euros con cincuenta.', 'The vendor: "Six buñuelos, right? That\'s three fifty."', 'Vendedor'); } },
      gems: [{ id: 'bunyols', pos: new THREE.Vector3(-2.2, 2.9, -4.7), es: 'En las Fallas se comen buñuelos de calabaza con chocolate. También se bebe horchata, hecha con chufa, con fartons para mojar.', en: 'The festival snacks: pumpkin fritters dipped in hot chocolate, and horchata, a cold drink made from tiger nuts (chufa), with long sweet fartons for dunking.' }] };
  },
});

/* =========================================================================================
   5 · LA CREMÀ · the plaza falla burns (night, 19 March)
   ========================================================================================= */
defineScene('crema', {
  place: '<b>Día 5 · 19 de marzo</b> · Plaza del Ayuntamiento · 00:55', look: 'night',
  cam: { th: .35, ph: 1.15, r: 96, target: [0, 15, 0] },
  line: ['Es la última noche de las Fallas. Dentro de un momento quemarán la falla.', 'Nerea: "It\'s the last night of Fallas. In a moment they\'ll burn the falla."'],
  build(g) {
    const W = plazaWorld(g, true), F = buildFalla(g, STATE.theme); burnable(F.group);
    // a fire engine and the bomberos who protect the buildings
    const truck = new THREE.Group(); truck.position.set(44, 0, 30); truck.rotation.y = -2.3; g.add(truck);
    const red = M(0xC8102E, { roughness: .4 });
    mesh(new THREE.BoxGeometry(9, 2.6, 3), red, 0, 1.9, 0, truck); mesh(new THREE.BoxGeometry(3, 2.2, 3), red, 5.4, 1.7, 0, truck);
    mesh(new THREE.BoxGeometry(1.2, 1, 3.05), M(0x9FD0FF, { emissive: 0x203040 }), 6.2, 2.3, 0, truck);
    for (const x of [-3, 0, 5]) for (const z of [-1.55, 1.55]) mesh(new THREE.CylinderGeometry(.75, .75, .5, 16), M(0x1E1E28), x, .75, z, truck).rotation.x = Math.PI / 2;
    const lad = mesh(new THREE.BoxGeometry(9, .3, 1), M(0xC9CED8, { metalness: .6 }), -.5, 3.4, 0, truck);
    const beacon = mesh(new THREE.BoxGeometry(1.4, .3, .4), new THREE.MeshBasicMaterial({ color: 0x3A7BFF }), 5.4, 2.95, 0, truck);
    const hoses = [];
    [[-24, 20, 3.6], [24, 20, -.6], [-30, -8, 1.9], [30, -8, 1.2]].forEach(([x, z, ry]) => {
      const b = person({ skirt: false, topC: 0x1E2A44, pantsC: 0x1E2A44, hat: 'fireman', pose: 'offer', scarf: 0xF2C200 }, .22); b.position.set(x, 0, z); b.rotation.y = ry; g.add(b);
      const target = new THREE.Vector3(x * 1.9, rnd(10, 18), z * 1.9); hoses.push({ from: new THREE.Vector3(x, 2, z), target });
    });
    // fire state
    const parts = []; F.group.updateMatrixWorld(true);
    let minY = 1e9, maxY = -1e9; const wp = new THREE.Vector3();
    F.group.traverse(o => { if (o.isMesh) { const bb = new THREE.Box3().setFromObject(o), c = bb.getCenter(new THREE.Vector3()); minY = Math.min(minY, bb.min.y); maxY = Math.max(maxY, bb.max.y); parts.push({ m: o, p: c, bb }); } });
    parts.forEach(p => { p.isBase = p.bb.max.y < 4.6; p.start = (p.bb.min.y - minY) / (maxY - minY) * 14 + rnd(0, 3); p.dur = rnd(9, 14) + (p.bb.max.y - p.bb.min.y) * .15; p.y0 = p.m.position.y; });
    // the wooden skeleton inside the monument, revealed as the figures burn away
    const skel = new THREE.Group(); g.add(skel);
    const beamM = new THREE.MeshStandardMaterial({ color: 0x3A2414, emissive: 0xFF5A10, emissiveIntensity: 0, roughness: .9 });
    for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2, r = k % 2 ? 4.5 : 3; const b = mesh(new THREE.BoxGeometry(.4, maxY * .78, .4), beamM, Math.cos(a) * r, maxY * .39 + 4, Math.sin(a) * r, skel); b.rotation.z = Math.cos(a) * .06; }
    for (let y = 7; y < maxY * .8; y += 4) mesh(new THREE.TorusGeometry(4.2 - y * .04, .18, 6, 20), beamM, 0, y, 0, skel).rotation.x = Math.PI / 2;
    for (let k = 0; k < 14; k++) { const b = mesh(new THREE.BoxGeometry(.3, 9, .3), beamM, rnd(-4, 4), rnd(8, maxY * .7), rnd(-4, 4), skel); b.rotation.set(rnd(-1, 1), rnd(0, 3), rnd(-1, 1)); }
    skel.visible = false;
    const orange = new THREE.Color(0xFF8A40);
    const inBox = bb => new THREE.Vector3(rnd(bb.min.x, bb.max.x), rnd(bb.min.y, bb.max.y), rnd(bb.min.z, bb.max.z));
    const fire = new THREE.PointLight(0xFF7A2A, 0, 140); fire.position.set(0, 12, 6); g.add(fire);
    const char = new THREE.Color(0x140C08);
    let phase = 'idle', T = 0, fuse = null;
    const rocket = () => {
      const x = rnd(-50, 50), z = rnd(-60, -30), y0 = 2, top = rnd(40, 60), c = pick([0xFF4D6D, 0x5FE0C8, 0xFFD25A, 0xB98CFF, 0xFFFFFF]);
      const s = sprite(g, TEX.spark, 0xFFE7A8, x, y0, z, .9, true); whoosh();
      addPart(s, 1.2, (p, dt, f) => { s.position.y = y0 + (top - y0) * Math.sin(f * Math.PI / 2); if (p.life + dt >= p.max) { bang(.35); for (let k = 0; k < 40; k++) { const v = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(rnd(9, 14)); ember(g, s.position.x, s.position.y, s.position.z, v, c, 1.8, 4, .9); } } });
    };
    const action = { label: '¡Que empiece la cremà!', fn(btn) {
      if (phase !== 'idle') return; btn.disabled = true; btn.textContent = 'Fuegos artificiales…'; phase = 'fireworks'; T = 0;
      say('¡Mira los fuegos! Después, la fallera mayor encenderá la traca.', 'Nerea: "Look at the fireworks! Afterwards, the fallera mayor will light the fuse."');
    } };
    const step = (t, dt) => {
      W.anims.forEach(f => f(t)); beacon.material.color.setHex(Math.sin(t * 10) > 0 ? 0x3A7BFF : 0xFF2A2A);
      if (phase === 'idle') { F.anims.forEach(f => f(t)); return; }
      T += dt;
      if (phase === 'fireworks') { if (Math.random() < dt * 3.5) rocket(); if (T > 6) { phase = 'fuse'; T = 0; fuse = { p: new THREE.Vector3(0, .3, 29) }; $('#goBtn').textContent = 'La traca…'; } }
      if (phase === 'fuse') { fuse.p.z -= dt * 7; fuse.p.x = Math.sin(fuse.p.z * .6) * 1.2; for (let k = 0; k < 3; k++) ember(g, fuse.p.x, fuse.p.y, fuse.p.z, new THREE.Vector3(rnd(-2, 2), rnd(2, 5), rnd(-2, 2)), 0xFFE7A8, .5, 9, .4); if (Math.random() < .5) crackle();
        if (fuse.p.z < 12.5) { phase = 'burn'; T = 0; bang(.9, true); W.crowd.excite = 1; $('#goBtn').textContent = '¡La cremà!'; say('¡Ya arde! ¡Qué calor!', 'Nerea: "It\'s burning! It\'s so hot!"'); } }
      if (phase === 'burn' || phase === 'after') {
        let burning = 0;
        for (const p of parts) {
          const k = (T - p.start) / p.dur; if (k < 0 || p.done) continue;
          const mats = Array.isArray(p.m.material) ? p.m.material : [p.m.material];
          mats.forEach(m => { if (m.color) m.color.lerp(char, Math.min(1, dt * 1.2)); if (m.emissive) { m.emissive.setHex(0xFF4A10); m.emissiveIntensity = k < 1 ? (.4 + Math.random() * .6) * (1 - k) : 0; } });
          if (k < 1) burning++;
          if (k > .55 && !p.isBase) { p.m.position.y -= dt * (k - .5) * 2.5; p.m.scale.multiplyScalar(1 - dt * .12); }
          if (k >= 1) { p.done = true; if (!p.isBase) p.m.visible = false; }
        }
        const live = parts.filter(p => !p.done && T > p.start), frac = Math.min(1, live.length / (parts.length * .35));
        for (let k = 0; k < 14 + frac * 50; k++) { const p = inBox(pick(live.length ? live : parts).bb); if (!live.length && k > 6) break; flame(g, p.x + rnd(-1.5, 1.5), Math.max(4.5, p.y - 2), p.z + rnd(-1.5, 1.5), rnd(4, 11) * (.6 + frac * .7), rnd(4, 9)); }
        for (let k = 0; k < frac * 10; k++) flame(g, rnd(-6, 6), rnd(4.5, 8), rnd(-6, 6), rnd(10, 18), rnd(6, 12));
        if (T > 6) { skel.visible = true; beamM.emissiveIntensity = .6 + Math.random() * .8; }
        if (phase === 'after') { skel.children.forEach(b => { b.position.y = Math.max(5, b.position.y - dt * 6); b.rotation.z += dt * .3; }); }
        hemi.color.lerp(orange, Math.min(1, dt * frac));
        if (live.length && Math.random() < .6) puff(g, rnd(-6, 6), maxY * .6 + rnd(0, 10), rnd(-6, 6), 3, 0x3A302C, 2.5);
        if (Math.random() < .5) ember(g, rnd(-8, 8), rnd(4, 20), rnd(-8, 8), new THREE.Vector3(rnd(-2, 2), rnd(4, 9), rnd(-2, 2)), 0xFFA040, 2.5, -1, .35);
        if (Math.random() < live.length / 300) crackle();
        fire.intensity = (1.5 + frac * 7) * (0.85 + Math.random() * .3);
        if (phase === 'burn' && T > 26 && burning < 4) { phase = 'after'; W.crowd.excite = 0; $('#goBtn').textContent = 'Fin de las Fallas'; say('¡Adiós, falla! El año que viene volveremos.', 'Nerea: "Goodbye, falla! Next year we\'ll come back."'); }
        if (phase === 'after') { for (let k = 0; k < 2; k++) flame(g, rnd(-7, 7), 4.5, rnd(-7, 7), rnd(1.5, 3), 1.5); fire.intensity = 1.2 + Math.random() * .4; }
      }
      // bomberos keep the façades wet
      if (phase === 'burn' || phase === 'after') hoses.forEach(h => { if (Math.random() < .6) { const v = h.target.clone().sub(h.from).multiplyScalar(.9); v.y += 9; ember(g, h.from.x, h.from.y, h.from.z, v, 0xBFE6FF, 1.1, 9, .45); } });
    };
    return { anims: [step], action, onExit() { if (phase !== 'idle') setTimeout(() => rebuild(['crema']), 0); },
      gems: [{ id: 'crema', pos: F.spots.plinth.clone().add(new THREE.Vector3(0, 3, 0)), es: 'La noche del 19 de marzo es la cremà: queman casi todas las fallas. La falla de esta plaza se quema la última. Los bomberos mojan los edificios.', en: 'On the night of 19 March almost every falla is burned. The town-square falla goes last, around 1 a.m., while firefighters soak the nearby buildings.' }] };
  },
});
